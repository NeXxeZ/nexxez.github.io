<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0e1621"/>
    </linearGradient>

    <!-- Accent glow -->
    <radialGradient id="glow" cx="80%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#63f2b0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#63f2b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.05">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#ffffff"/>
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#ffffff"/>
  </g>

  <!-- Left content -->
  <text x="120" y="220" fill="#d8e4f2" font-size="52" font-weight="600" font-family="system-ui, -apple-system, sans-serif">
    Joan Palacios
  </text>

  <text x="120" y="260" fill="#63f2b0" font-size="22" font-family="monospace">
    aka NeXxeZ
  </text>

  <text x="120" y="340" fill="#a8c0d8" font-size="28" font-family="system-ui, -apple-system, sans-serif">
    Full Stack Developer
  </text>

  <text x="120" y="390" fill="#7ab7ff" font-size="22" font-family="system-ui, -apple-system, sans-serif">
    E-commerce · Magento · Automation · Systems
  </text>

  <!-- Right side subtle code -->
  <g opacity="0.25">
    <text x="750" y="220" fill="#63f2b0" font-size="18" font-family="monospace">
      $ optimize --platform ecommerce
    </text>
    <text x="750" y="260" fill="#63f2b0" font-size="18" font-family="monospace">
      $ build --system scalable
    </text>
    <text x="750" y="300" fill="#63f2b0" font-size="18" font-family="monospace">
      $ automate --process
    </text>
  </g>

  <!-- Bottom line -->
  <rect x="120" y="450" width="200" height="2" fill="#63f2b0"/>
</svg>